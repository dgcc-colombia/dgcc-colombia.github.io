<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitación en IA y gobierno digital | DGCC</title>
<style>
:root{
  --c-primary:#004884; --c-blue:#3366CC; --c-sky:#E8F0FC; --c-yellow:#FFB000; --c-yellow-soft:#FFF4D6; --c-red:#C8102E;
  --c-ink:#14212E; --c-sub:#46586B; --c-line:#D8E0EA;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{word-break:keep-all;overflow-wrap:break-word;background:#fff;font-family:var(--font);color:var(--c-ink);line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.flag{display:flex;width:132px;height:8px;margin-bottom:34px}
.flag i{display:block;height:100%}
.flag i:nth-child(1){flex:2;background:var(--c-yellow)}
.flag i:nth-child(2){flex:1;background:var(--c-blue)}
.flag i:nth-child(3){flex:1;background:var(--c-red)}

.nav{background:#fff;border-bottom:1px solid var(--c-line);margin-top:56px;border-top:1px solid var(--c-line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px}
.brand{font-weight:700;color:var(--c-primary);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;align-items:center;gap:4px}
.menu a{font-size:15px;font-weight:600;color:var(--c-ink);text-decoration:none;padding:10px 12px;cursor:pointer}
.menu a:hover{color:var(--c-primary);background:var(--c-sky)}
.lang{display:inline-flex;border:1px solid var(--c-primary);overflow:hidden;flex:none}
.lang button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border:0;background:transparent;color:var(--c-primary);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--c-primary);color:#fff}

.hero{padding:96px 0 88px}
.hero .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:48px 72px}
.hero .main{flex:999 1 520px;min-width:0}
.hero h1{font-size:clamp(34px,5.2vw,64px);font-weight:700;letter-spacing:-.025em;line-height:1.14;color:var(--c-primary);white-space:pre-line}
.hero .lead{margin-top:24px;font-size:18px;line-height:1.7;color:var(--c-sub);max-width:46ch}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:36px}
.cta{display:inline-block;background:var(--c-primary);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:14px 30px;border:0;cursor:pointer}
.cta:hover{background:#003462}
.sub-link{font:inherit;font-size:16px;font-weight:600;color:var(--c-ink);background:none;border:0;border-bottom:1px solid var(--c-ink);padding:6px 0;cursor:pointer}
.sub-link:hover{color:var(--c-primary);border-color:var(--c-primary)}
.facts{flex:1 1 340px;border-top:3px solid var(--c-primary)}
.facts div{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--c-line)}
.facts dt{flex:0 0 96px;font-size:15px;font-weight:700;color:var(--c-primary)}
.facts dd{font-size:16px}

.band{padding:64px 0;scroll-margin-top:16px}
.band.tint{background:#F6F8FB}
.band.line{border-top:1px solid var(--c-line);padding:56px 0}
h2{font-size:28px;font-weight:700;color:var(--c-primary)}
.gov{margin-top:6px;font-size:16px;color:var(--c-sub);max-width:70ch}

.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:32px 28px;margin-top:28px}
.day{display:grid;grid-template-rows:subgrid;grid-row:span 6;row-gap:0;border-top:3px solid var(--c-primary)}
.day .dh{display:flex;align-items:baseline;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--c-line)}
.day .dh b{font-size:56px;font-weight:700;line-height:1;color:var(--c-primary);letter-spacing:-.03em}
.day .dh span{font-size:15px;color:var(--c-sub)}
.minor{display:flex;gap:12px;padding:10px 0;font-size:14px;color:var(--c-sub);border-bottom:1px solid var(--c-line);font-variant-numeric:tabular-nums}
.blk{padding:18px;display:flex;flex-direction:column;gap:8px}
.blk.am{background:var(--c-sky)}
.blk.pm{background:var(--c-yellow-soft)}
.blk .slot{font-size:14px;font-weight:700;color:var(--c-primary);font-variant-numeric:tabular-nums}
.blk h3{font-size:19px;line-height:1.4}
.blk ul{padding-left:18px;font-size:15px;line-height:1.6}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 40px;margin-top:18px;border-bottom:1px solid var(--c-line)}
.info div{padding:16px 0;border-top:1px solid var(--c-line)}
.info h3{font-size:16px;color:var(--c-primary)}
.info p{margin-top:4px;font-size:16px}
.survey .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:36px 64px}
.survey .qrw{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto}
.survey .qr{width:320px;height:320px;display:flex;align-items:center;justify-content:center;background:#fff;padding:14px;border:4px solid var(--c-primary);border-radius:18px;box-shadow:0 0 0 6px var(--c-yellow-soft)}
.survey .qr.ph{border:2px dashed #7B8794;color:#5F6B7A;font-size:20px;font-weight:700}
.survey .qr img{width:100%;height:100%;display:block}
.survey .qrw span{font-size:18px;font-weight:700;color:var(--c-primary)}
.survey .qrw .url{font-size:15px;font-weight:600;color:var(--c-primary);word-break:break-all;text-align:center}
.survey .qrw .url:hover{text-decoration:underline}
.survey .qrw .scan{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--dg-muted-ink)}
.survey .txt{flex:1 1 420px;min-width:0}
.steps{list-style:none;margin-top:20px;border-bottom:1px solid var(--c-line)}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;padding:14px 0;border-top:1px solid var(--c-line)}
.steps li i{grid-row:span 2;font-style:normal;font-size:30px;font-weight:700;line-height:1.1;color:var(--c-primary)}
.steps li b{font-size:18px}
.steps li span{font-size:16px;color:var(--c-sub)}
.must{margin-top:20px;padding:16px 18px;background:var(--c-yellow-soft);font-size:17px;font-weight:700}
.contact .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 40px}
.contact p{font-size:17px;flex:1 1 360px}
.site-foot{background:var(--c-ink);color:#C4CEDA;padding:30px 0 36px;font-size:14px}
.site-foot strong{display:block;color:#fff;font-size:15px;margin-bottom:6px}
.site-foot span{display:block}
:focus-visible{outline:3px solid var(--c-red);outline-offset:2px}

@media (max-width:760px){
  .survey .qrw{order:2}
  .brand{display:none}
  .nav .wrap{justify-content:flex-end}
  .menu{flex-wrap:wrap;justify-content:flex-end;row-gap:0}
  .menu a{padding:10px 6px;font-size:14px}
  .nav .wrap{padding:6px 16px}
  .lang button{padding:8px 10px}
  .hero{padding:56px 0 52px}
  .band{padding:44px 0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}


:root{--dg-navy:#182849;--dg-bg:#F7F8FC;--dg-row:#EAEDF2;--dg-line:#E3E7EE;--dg-muted-ink:#62686C;--dg-radius:14px;--dg-radius-sm:10px;
  --dg-shadow:0 1px 2px rgba(24,40,73,.04),0 4px 16px rgba(24,40,73,.05)}
body{background:var(--dg-bg)}
.nav{border-color:var(--dg-line)}
.hero{background:#fff;border-bottom:1px solid var(--dg-line);padding:72px 0 64px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dg-muted-ink);margin-bottom:12px}
.cta{border-radius:999px;padding:12px 28px}
.facts{border-top:0;background:var(--dg-bg);border:1px solid var(--dg-line);border-radius:var(--dg-radius);padding:6px 20px}
.facts div:last-child{border-bottom:0}
.band.tint{background:transparent}
.band{padding:52px 0}
.day{background:#fff;border:1px solid var(--dg-line);border-top:1px solid var(--dg-line);border-radius:var(--dg-radius);box-shadow:var(--dg-shadow);padding:6px 18px 16px}
.day .dh{border-bottom:0;padding:14px 0 10px}
.minor{background:var(--dg-row);border-bottom:0;border-radius:var(--dg-radius-sm);padding:8px 14px;margin:6px 0;color:var(--dg-muted-ink)}
.blk{border-radius:var(--dg-radius-sm)}
.info{gap:12px;border-bottom:0;margin-top:20px}
.info div{background:#fff;border:1px solid var(--dg-line);border-radius:var(--dg-radius);box-shadow:var(--dg-shadow);padding:16px 20px}
.survey .wrap{background:#fff;border:1px solid var(--dg-line);border-radius:var(--dg-radius);box-shadow:var(--dg-shadow);padding:32px 36px;max-width:1072px}
.survey .qr.ph{border-radius:var(--dg-radius-sm)}
.must{border:1px solid #F0D58A;border-radius:var(--dg-radius-sm)}
.band.line{border-top:0}
.site-foot{background:var(--dg-navy)}
@media (max-width:760px){.survey .wrap{margin:0 16px;padding:22px 18px}}
.mr{display:flex;gap:12px}
.mr span:first-child{white-space:nowrap}
.minor{flex-direction:column;gap:2px}
.minor.blank{visibility:hidden}
.blk .tag{align-self:flex-start;margin-top:4px;font-size:13px;color:var(--dg-muted-ink);border:1px dashed #B9C3CF;border-radius:999px;padding:2px 10px;background:#fff}
.mat .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 48px;background:#fff;border:1px solid var(--dg-line);border-radius:var(--dg-radius);box-shadow:var(--dg-shadow);padding:28px 36px;max-width:1072px}
.mat .txt{flex:1 1 420px;min-width:0}
.mat .cta{text-decoration:none}
.mat .wait{font-size:16px;font-weight:700;color:var(--c-primary);background:var(--c-sky);border-radius:var(--dg-radius-sm);padding:12px 18px}
.rnb{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:50;font-family:var(--font)}
.rnb .tg{display:none}
.rnb ul{list-style:none;background:#fff;border:1px solid var(--dg-line);border-radius:var(--dg-radius);box-shadow:var(--dg-shadow);padding:8px}
.rnb a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--c-sub);text-decoration:none;cursor:pointer;white-space:nowrap}
.rnb a i{width:8px;height:8px;border-radius:50%;background:#C3CCD8;flex:none}
.rnb a:hover{background:var(--c-sky);color:var(--c-primary)}
.rnb a.on{color:var(--c-primary);background:var(--c-sky)}
.rnb a.on i{background:var(--c-yellow);box-shadow:0 0 0 3px #FFE9A8}
.rnb a.top{border-top:1px solid var(--dg-line);border-radius:0 0 10px 10px;margin-top:4px;padding-top:11px}
@media (max-width:1279px){
 .rnb{top:auto;bottom:20px;transform:none;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
 .rnb .tg{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;border:0;background:var(--c-primary);color:#fff;box-shadow:0 6px 18px rgba(0,72,132,.35);cursor:pointer;font:inherit;font-size:13px;font-weight:700}
 .rnb ul{display:none;order:-1}
 .rnb.open ul{display:block}
}
@media print{.rnb{display:none}}
.svbtn{text-decoration:none;margin-top:4px;font-size:18px;padding:14px 34px}
@media (max-width:760px){.survey .qrw{order:0}.survey .qr{width:min(280px,78vw);height:min(280px,78vw)}}
.survey .qr img{image-rendering:pixelated}
[hidden]{display:none !important}
@media (max-width:760px){.mat .wrap{margin:0 16px;padding:22px 18px}}
.today{padding-bottom:0}
.dsel{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dsel button{font:inherit;font-size:15px;font-weight:700;padding:10px 18px;border:1px solid var(--c-primary);border-radius:999px;background:#fff;color:var(--c-primary);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.dsel button:hover{background:var(--c-sky)}
.dsel button[aria-pressed="true"]{background:var(--c-primary);color:#fff}
.dsel button em{font-style:normal;font-size:12px;font-weight:700;background:var(--c-yellow);color:var(--c-ink);border-radius:999px;padding:1px 8px}
.dview{margin-top:22px;max-width:1072px;background:#fff;border:1px solid var(--dg-line);border-radius:var(--dg-radius);box-shadow:var(--dg-shadow);overflow:hidden}
.dv-head{position:relative;background:var(--c-primary);color:#fff;padding:28px 32px 26px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 32px}
.dv-head .fl{position:absolute;left:0;right:0;top:0;display:flex;height:5px}
.dv-head .fl i{display:block}.dv-head .fl i:nth-child(1){flex:2;background:var(--c-yellow)}.dv-head .fl i:nth-child(2){flex:1;background:var(--c-blue)}.dv-head .fl i:nth-child(3){flex:1;background:var(--c-red)}
.dv-date{display:flex;align-items:center;gap:18px}
.dv-date b{font-size:72px;line-height:.9;font-weight:700;letter-spacing:-.04em}
.dv-date p{font-size:13px;font-weight:700;letter-spacing:.06em;color:#BFD4EA;text-transform:uppercase}
.dv-date h3{font-size:24px;line-height:1.25;margin-top:2px}
.dv-chips{display:flex;flex-wrap:wrap;gap:8px}
.dv-chips span{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:var(--dg-radius-sm);padding:9px 14px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.dv-chips small{font-size:12px;font-weight:600;color:#BFD4EA}
.dv-r{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.dv-dl{display:flex;align-items:center;gap:8px;background:#fff;color:var(--c-primary);border-radius:var(--dg-radius-sm);padding:9px 18px;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
.dv-dl:hover{background:var(--c-yellow-soft)}
.dv-dl svg{width:18px;height:18px;flex:none}
.tline{list-style:none;position:relative;padding:26px 32px 30px}
.tline::before{content:"";position:absolute;left:calc(32px + 96px + 11px);top:34px;bottom:40px;width:2px;background:var(--dg-line)}
.tline li{display:grid;grid-template-columns:96px 24px 1fr;column-gap:12px;align-items:start;padding:6px 0}
.tline time{text-align:right;font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--c-primary);padding-top:14px;line-height:1.2}
.tline time small{display:block;font-size:13px;font-weight:600;color:var(--dg-muted-ink)}
.tline .dot{justify-self:center;width:14px;height:14px;margin-top:18px;border-radius:50%;background:#fff;border:3px solid var(--c-primary);position:relative;z-index:1}
.tline li.mn time{font-size:14px;font-weight:600;color:var(--dg-muted-ink);padding-top:9px}
.tline li.mn .dot{width:10px;height:10px;border:0;background:#C3CCD8;margin-top:13px}
.tline li.mn .c{padding:8px 0;font-size:15px;color:var(--dg-muted-ink)}
.tline li.am .dot{border-color:var(--c-blue)}.tline li.pm .dot{border-color:var(--c-yellow)}
.tline .card{border:1px solid var(--dg-line);border-radius:var(--dg-radius);padding:18px 22px 20px;background:#fff}
.tline li.am .card{background:linear-gradient(#fff,#fff) padding-box;box-shadow:inset 0 3px 0 var(--c-blue)}
.tline li.pm .card{box-shadow:inset 0 3px 0 var(--c-yellow)}
.tline .lab{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.tline li.am .lab{background:var(--c-sky);color:var(--c-primary)}
.tline li.pm .lab{background:var(--c-yellow-soft);color:#7A5200}
.tline .card h4{font-size:21px;line-height:1.35;color:var(--c-ink)}
.tline .card ul{list-style:none;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:8px}
.tline .card li{display:flex;gap:10px;padding:0;font-size:15px;line-height:1.5;color:var(--c-sub);background:var(--dg-bg);border-radius:var(--dg-radius-sm);padding:9px 12px}
.tline .card li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--c-primary);margin-top:8px}
.tline .card .tg{display:inline-block;margin-top:12px;font-size:13px;color:var(--dg-muted-ink);border:1px dashed #B9C3CF;border-radius:999px;padding:2px 10px}
.tline li.sv .dot{border-color:var(--c-red)}
.tline .svc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;background:var(--c-yellow-soft);border:1px solid #F0D58A;border-radius:var(--dg-radius);padding:18px 22px}
.tline .svc h4{font-size:20px;color:var(--c-ink)}
.tline .svc p{font-size:15px;color:var(--c-sub);margin-top:4px}
.tline .svc .go{display:flex;align-items:stretch;gap:16px}
.tline .svc .go>div{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.tline .svc img{width:108px;height:108px;background:#fff;border:3px solid var(--c-primary);border-radius:12px;padding:5px;image-rendering:pixelated;cursor:pointer}
.tline .svc .cta{text-decoration:none}
.tline .svc .url{display:block;font-size:14px;font-weight:600;color:var(--c-primary);padding-bottom:2px}
.tline li.mat .c{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 0}
.tline li.mat a{font-size:15px;font-weight:700;color:var(--c-primary);text-decoration:none;border:1px solid var(--c-primary);border-radius:999px;padding:8px 18px}
.tline li.mat a:hover{background:var(--c-sky)}
@media (max-width:760px){.today>.wrap{padding:0 16px}.dsel button{padding:9px 14px;font-size:14px}
 .dv-head{padding:24px 18px 20px}.dv-date b{font-size:56px}.dv-date h3{font-size:20px}
 .tline{padding:18px 14px 22px}.tline::before{left:calc(14px + 52px + 8px)}
 .tline li{grid-template-columns:52px 16px 1fr;column-gap:8px}.tline time{font-size:14px}.tline time small{font-size:12px}
 .tline .card{padding:14px 14px 16px}.tline .card h4{font-size:18px}.tline .svc{padding:16px}.tline .svc .go{flex-wrap:wrap}}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <span class="brand" data-t="brand"></span>
    <div class="menu">
      <a data-go="sec-today" data-t="n1" tabindex="0" role="link"></a>
      <a data-go="sec-mat" data-t="n6" tabindex="0" role="link"></a>
      <a data-go="sec-info" data-t="n3" tabindex="0" role="link"></a>
      <a data-go="sec-survey" data-t="n5" tabindex="0" role="link"></a>
      <a data-go="sec-contact" data-t="n4" tabindex="0" role="link" class="opt-contact"></a>
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="es" aria-pressed="false">Español</button>
      </div>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="main">
      <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 data-t="title2"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="acts">
        <button class="cta" type="button" data-go="sec-today" data-t="cta"></button>
        <button class="sub-link" type="button" data-go="sec-mat" data-t="cta2"></button>
      </div>
    </div>
    <dl class="facts" id="facts"></dl>
  </div>
</header>

<main>
  <section class="band today" id="sec-today"><div class="wrap">
    <h2 data-t="td_h2"></h2>
    <div class="dsel" id="dsel" role="group"></div>
    <div class="dview" id="dview" hidden></div>
  </div></section>

  <section class="band tint" id="sec-tt"><div class="wrap">
    <h2 data-t="h_tt"></h2>
    <p class="gov" data-t="gov"></p>
    <div class="days" id="days"></div>
  </div></section>

  <section class="band mat" id="sec-mat"><div class="wrap">
    <div class="txt">
      <h2 data-t="h_mat"></h2>
      <p class="gov" data-t="gov_mat"></p>
    </div>
    <div class="dl" id="dl"></div>
  </div></section>

  <section class="band" id="sec-info"><div class="wrap">
    <h2 data-t="h_info"></h2>
    <div class="info" id="cards"></div>
  </div></section>

  <section class="band tint survey" id="sec-survey"><div class="wrap">
    <div class="qrw" id="qrw"><span class="scan" data-t="sv_scan"></span><div class="qr" id="qr"></div><span data-t="sv_cap"></span><a class="cta svbtn" id="svbtn" target="_blank" rel="noopener"></a><a class="url" id="svurl" target="_blank" rel="noopener"></a></div>
